services:
  backend:
    build:
      context: .
      target: runtime
    ports:
      - '127.0.0.1:4000:4000'
    env_file: .env.docker
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://workuz:workuz_dev_only@postgres:5432/workuz
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://workuz:workuz_dev_only@postgres:5432/workuz
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: workuz
      POSTGRES_PASSWORD: workuz_dev_only
      POSTGRES_DB: workuz
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'workuz', '-d', 'workuz']
      interval: 3s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
