services:
  - type: web
    name: workuz-api
    runtime: node
    plan: free
    region: frankfurt
    autoDeployTrigger: 'off'
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build
    startCommand: npm run db:migrate && FRONTEND_URL="${FRONTEND_URL:-$RENDER_EXTERNAL_URL}" npm run start:prod
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_VERSION
        value: '24.22.1'
      - key: NODE_ENV
        value: production
      - key: SKIP_INSTALL_DEPS
        value: 'true'
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: workuz-otp
          property: connectionString
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: RESET_TOKEN_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: '2525'
      - key: SMTP_USER
        sync: false
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        sync: false

  - type: keyvalue
    name: workuz-otp
    region: frankfurt
    plan: free
    ipAllowList: []
