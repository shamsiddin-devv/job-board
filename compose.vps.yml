name: workuz-vps

services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env.vps}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env.vps
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://workuz:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.vps}@postgres:5432/workuz
      REDIS_URL: redis://redis:6379
    networks: [edge, private]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  migrate:
    profiles: [tools]
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://workuz:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.vps}@postgres:5432/workuz
      CHECKPOINT_DISABLE: '1'
    networks: [private]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: workuz
      POSTGRES_USER: workuz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.vps}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [private]
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'workuz', '-d', 'workuz']
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [private]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 15

networks:
  edge:
  private:
    internal: true

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
